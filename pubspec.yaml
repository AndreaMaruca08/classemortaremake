name: classemortaremake
description: "The remake of Classemorta mobile"
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shared_preferences: ^2.1.2
  url_launcher: ^6.3.0
  fl_chart: ^0.70.2
  table_calendar: ^3.1.2
  path_provider: ^2.1.2
  open_file_plus: ^3.4.1
  mime: ^1.0.5
  flutter_widget_from_html: ^0.15.2



  http: any
  html: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  vector_math: ^2.1.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icona.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
