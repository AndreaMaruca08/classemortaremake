name: classemortaremake
description: "The remake of Classemorta mobile"
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.0
  fl_chart: ^1.2.0
  table_calendar: ^3.1.3
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  mime: ^2.0.0
  flutter_widget_from_html: ^0.17.2

  http: ^1.2.2
  html: ^0.15.4
  pdf: ^3.12.0
  printing: ^5.14.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icona.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
